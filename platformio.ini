; Host-native unit tests for the hardware-independent pure-logic modules
; (bench_math, card_format, card_identity). Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -Isrc -std=gnu++17
build_src_filter =
    -<*>
    +<benchmark/bench_math.cpp>
    +<hardware/card_format.cpp>
    +<hardware/card_identity.cpp>
    +<hardware/touch_calibration.cpp>
    +<ui/ui_geometry.cpp>
test_build_src = true

[env:cyd]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    greiman/SdFat@2.3.1

build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D USE_SPI_ARRAY_TRANSFER=1
    -D SPI_FREQUENCY=40000000
